[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sn101-edge"
version = "1.0.0"
description = "Competitive miner for Tag101 / Bittensor SN101."
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "sentence-transformers>=2.7",
]

[tool.setuptools]
packages = ["sn101_edge"]
